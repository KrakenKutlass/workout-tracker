services:
  rehab-loop:
    build:
      context: .
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: rehab-loop
    restart: unless-stopped
    ports:
      - "3004:3001"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - NODEMAILER_HOST=${NODEMAILER_HOST:-smtp.gmail.com}
      - NODEMAILER_PORT=${NODEMAILER_PORT:-587}
      - NODEMAILER_USER=${NODEMAILER_USER:-}
      - NODEMAILER_PASS=${NODEMAILER_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@rehabloop.app}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_FROM=${TWILIO_FROM:-}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
